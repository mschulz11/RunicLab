name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build & Test
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            src/RunicLab/RunicLab.csproj
            tests/RunicLab.Tests/RunicLab.Tests.csproj

      - name: Install MAUI workloads
        run: dotnet workload install maui-android maui-windows --skip-sign-check

      - name: Install Android SDK dependencies
        run: >
          dotnet build src/RunicLab/RunicLab.csproj -f net10.0-android
          -t:InstallAndroidDependencies
          -p:AndroidSdkDirectory="$env:ANDROID_HOME"
          -p:AcceptAndroidSdkLicenses=True

      - name: Test
        run: >
          dotnet test tests/RunicLab.Tests/RunicLab.Tests.csproj
          -c Release
          --logger "trx;LogFileName=test-results.trx"
          --results-directory artifacts/test

      - name: Build Windows
        run: >
          dotnet build src/RunicLab/RunicLab.csproj
          -f net10.0-windows10.0.19041.0
          -c Release
          -p:TargetFrameworks=net10.0-windows10.0.19041.0

      - name: Publish Android APK (unsigned, build proof)
        run: >
          dotnet publish src/RunicLab/RunicLab.csproj
          -f net10.0-android
          -c Release
          -p:TargetFrameworks=net10.0-android
          -p:RuntimeIdentifier=android-arm64
          -p:AndroidPackageFormat=apk
          -p:AndroidSdkDirectory="$env:ANDROID_HOME"
          -o artifacts/apk

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test
          retention-days: 7

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-pr-${{ github.run_number }}
          path: artifacts/apk/*.apk
          retention-days: 7
