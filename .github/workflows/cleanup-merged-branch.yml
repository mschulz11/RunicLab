name: Branch nach Merge löschen

# Sicherheitsnetz zu Issue #13: Wenn ein Pull Request nach master gemerged wird,
# wird der Head-Branch gelöscht. Die Repository-Einstellung
# "Automatically delete head branches" erledigt das im Normalfall schon selbst;
# dieser Workflow fängt Fälle ab, in denen sie (noch) nicht greift.

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: read

jobs:
  delete-merged-branch:
    name: Head-Branch löschen
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Branch löschen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          echo "PR #${{ github.event.pull_request.number }} gemerged: $BRANCH (aus $HEAD_REPO)"

          if [ "$HEAD_REPO" != "$REPO" ]; then
            echo "Branch stammt aus einem Fork – wird nicht angefasst."
            exit 0
          fi

          if [ "$BRANCH" = "$DEFAULT_BRANCH" ]; then
            echo "Das ist der Default-Branch – wird nicht gelöscht."
            exit 0
          fi

          if ! gh api "repos/$REPO/git/ref/heads/$BRANCH" >/dev/null 2>&1; then
            echo "Branch existiert nicht mehr – nichts zu tun."
            exit 0
          fi

          gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH"
          echo "Branch '$BRANCH' gelöscht."
