<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Hintergrund-Ebene des App-Icons, helle Fassung (#8). Das Motiv
     (appiconfg.png) ist transparent; diese Fläche liefert den Grund.
     Dunkle Fassung für Android: Platforms/Android/Resources/mipmap-night-anydpi-v26/. -->
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <radialGradient id="grund" cx="50%" cy="45%" r="65%">
            <stop offset="0%" stop-color="#FBF9FF" />
            <stop offset="100%" stop-color="#DCD5F2" />
        </radialGradient>
    </defs>
    <rect x="0" y="0" width="456" height="456" fill="url(#grund)" />
</svg>
